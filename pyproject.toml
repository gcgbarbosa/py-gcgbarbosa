[project]
name = "py-gcgbarbosa"
version = "0.0.2"
description = "Starting point for Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["python", "template", "starter"]
authors = [{ name = "George C. G. Barbosa", email = "gcgbarbosa@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gcgbarbosa/py-gcgbarbosa"
Repository = "https://github.com/gcgbarbosa/py-gcgbarbosa"
Issues = "https://github.com/gcgbarbosa/py-gcgbarbosa/issues"
Changelog = "https://github.com/gcgbarbosa/py-gcgbarbosa/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "coverage-badge>=1.1.2",
  "docformatter>=1.7.5",
  "interrogate[png]>=1.7.0",
  "pyright>=1.1.398",
  "pytest>=8.4.2",
  "pytest-cov>=6.1.1",
  "ruff>=0.16.4",
  # coverage-badge 1.1.2 imports pkg_resources, which setuptools 82 removed.
  "setuptools<82",
  "ty>=0.0.74",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
extend-exclude = ["docs"]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pygcgb"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-module = false
ignore-property-decorators = false
fail-under = 95
exclude = ["tests/", "setup.py", "docs", 'old']
verbose = 1
omit-covered-files = false
quiet = false
whitelist-regex = []
ignore-regex = []
color = true

[project.scripts]
pygcgb = "pygcgb.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygcgb"]
